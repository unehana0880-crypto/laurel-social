<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Cinzel';src:url('{{fonts}}/cinzel-latin-600-normal.woff2')format('woff2');font-weight:600;font-display:block}
  @font-face{font-family:'Cormorant';src:url('{{fonts}}/cormorant-garamond-latin-300-normal.woff2')format('woff2');font-weight:300;font-display:block}
  @font-face{font-family:'Cormorant';src:url('{{fonts}}/cormorant-garamond-latin-400-normal.woff2')format('woff2');font-weight:400;font-display:block}
  @font-face{font-family:'Cormorant';src:url('{{fonts}}/cormorant-garamond-latin-300-italic.woff2')format('woff2');font-weight:300;font-style:italic;font-display:block}
  @font-face{font-family:'Inter';src:url('{{fonts}}/inter-latin-300-normal.woff2')format('woff2');font-weight:300;font-display:block}
  @font-face{font-family:'Inter';src:url('{{fonts}}/inter-latin-400-normal.woff2')format('woff2');font-weight:400;font-display:block}
  :root{
    --ink:{{p.ink}}; --raised:{{p.ink_raised}}; --card:{{p.ink_card}};
    --hair:{{p.hairline}}; --hair-soft:{{p.hairline_soft}};
    --type:{{p.ivory}}; --dim:{{p.ivory_dim}}; --faint:{{p.ivory_faint}};
    --accent:{{p.gold}}; --accent-lt:{{p.gold_light}}; --oak:{{p.gold_deep}};
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;background:#101010}
  .page{width:{{W}}px;height:{{H}}px;position:relative;overflow:hidden;
    background:var(--ink);color:var(--type)}
  .eyebrow{font-family:'Cinzel',serif;font-weight:600;letter-spacing:.4em;
    text-transform:uppercase;color:var(--accent)}
  .mark{font-family:'Cinzel',serif;font-weight:600;letter-spacing:.34em;
    text-transform:uppercase;color:var(--type)}
  h1,h2{font-family:'Cormorant',serif;font-weight:300;line-height:1.08;letter-spacing:-.008em}
</style></head><body>
{% block pages %}{% endblock %}
</body></html>
